name: TV Phone CI

on:
  push:
    branches:
      - master
      - 'build/**'
  pull_request:

concurrency:
  group: tv-phone-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies and generate lockfile
        run: npm install --no-audit --no-fund
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Production build and release gates
        run: npm run build
