name: Promote TV Phone Lockfile

on:
  push:
    branches:
      - build/lockfile-gen

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/mode-themes-v0.8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate exact npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Enforce deterministic Vercel install
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          config_path = Path('vercel.json')
          config = json.loads(config_path.read_text())
          config['installCommand'] = 'npm ci --no-audit --no-fund'
          ordered = {'$schema': config.pop('$schema')}
          ordered['installCommand'] = config.pop('installCommand')
          ordered.update(config)
          config_path.write_text(json.dumps(ordered, indent=2) + '\n')

          apply_path = Path('scripts/apply-delivery-security.mjs')
          apply = apply_path.read_text()
          needle = "  $schema: 'https://openapi.vercel.sh/vercel.json',\n"
          replacement = needle + "  installCommand: 'npm ci --no-audit --no-fund',\n"
          if needle not in apply:
              raise SystemExit('delivery config schema marker not found')
          if "installCommand: 'npm ci --no-audit --no-fund'" not in apply:
              apply = apply.replace(needle, replacement, 1)
          apply_path.write_text(apply)

          audit_path = Path('scripts/delivery-security-audit.mjs')
          audit = audit_path.read_text()
          marker = "const config = JSON.parse(await readFile('vercel.json', 'utf8'))\n"
          check = "if (config.installCommand !== 'npm ci --no-audit --no-fund') throw new Error('Delivery security audit failed: deterministic npm install command missing')\n"
          if marker not in audit:
              raise SystemExit('delivery audit config marker not found')
          if check not in audit:
              audit = audit.replace(marker, marker + check, 1)
          audit_path.write_text(audit)
          PY
      - name: Commit reproducible dependency graph
        shell: bash
        run: |
          git config user.name "Alec Price"
          git config user.email "52548136+Alecprice@users.noreply.github.com"
          git add package-lock.json vercel.json scripts/apply-delivery-security.mjs scripts/delivery-security-audit.mjs
          git diff --cached --check
          git commit -m "Lock dependency graph and enforce Vercel npm ci"
          git push origin HEAD:build/mode-themes-v0.8
