<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f17"><title>TV Phone Remote</title><style>html,body{margin:0;min-height:100%;background:#070a10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}small{color:#9aa8ba}</style></head><body><main id="load"><div><h2>Loading TV Phone Remote…</h2><small>Static test harness</small></div></main><script>(async()=>{try{const r=await fetch('./tv-phone-test.html',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const html=await r.text();document.open();document.write(html);document.close()}catch(e){document.getElementById('load').innerHTML='<div><h2>TV Phone failed to load</h2><small>'+String(e.message||e)+'</small></div>'}})();</script></body></html>
